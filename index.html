<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EMpower Grant Dashboard</title>
<style>
  :root {
    --teal: #1D9E75; --teal-light: #E1F5EE; --teal-dark: #0F6E56;
    --navy: #1a2744; --navy-light: #243159;
    --amber: #BA7517; --amber-light: #FAEEDA;
    --red: #A32D2D; --red-light: #FCEBEB;
    --green: #3B6D11; --green-light: #EAF3DE;
    --gray: #5F5E5A; --gray-light: #F1EFE8; --border: #ddd;
    --text: #1a1a1a; --text-muted: #666;
    --white: #fff; --radius: 8px;
    --shadow: 0 1px 4px rgba(0,0,0,.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
         font-size: 14px; color: var(--text); background: #f5f6fa; }

  /* ── Header ── */
  .header {
    background: var(--navy); color: white;
    padding: 14px 24px; display: flex; align-items: center;
    justify-content: space-between; position: sticky; top: 0; z-index: 100;
    box-shadow: 0 2px 8px rgba(0,0,0,.2);
  }
  .header-left { display: flex; align-items: center; gap: 12px; }
  .header-logo {
    width: 36px; height: 36px; background: var(--teal);
    border-radius: 50%; display: flex; align-items: center;
    justify-content: center; font-weight: 700; font-size: 14px; color: white;
  }
  .header-title { font-size: 16px; font-weight: 600; }
  .header-sub { font-size: 11px; opacity: .7; margin-top: 1px; }
  .header-meta { font-size: 11px; opacity: .6; text-align: right; }

  /* ── Layout ── */
  .layout { display: flex; height: calc(100vh - 56px); }

  /* ── Sidebar ── */
  .sidebar {
    width: 260px; flex-shrink: 0; background: var(--white);
    border-right: 1px solid var(--border); overflow-y: auto;
    display: flex; flex-direction: column;
  }
  .sidebar-search {
    padding: 12px; border-bottom: 1px solid var(--border); position: sticky; top: 0;
    background: white; z-index: 10;
  }
  .sidebar-search input {
    width: 100%; padding: 7px 10px; border: 1px solid var(--border);
    border-radius: var(--radius); font-size: 13px; outline: none;
  }
  .sidebar-search input:focus { border-color: var(--teal); }
  .sidebar-group-label {
    padding: 8px 12px 4px; font-size: 10px; font-weight: 600;
    color: var(--text-muted); text-transform: uppercase; letter-spacing: .5px;
    background: var(--gray-light); border-bottom: 1px solid var(--border);
  }
  .grant-item {
    padding: 10px 12px; cursor: pointer; border-bottom: 1px solid #f0f0f0;
    transition: background .15s;
  }
  .grant-item:hover { background: var(--teal-light); }
  .grant-item.active { background: var(--teal-light); border-left: 3px solid var(--teal); }
  .grant-item-name { font-size: 12px; font-weight: 500; color: var(--text); line-height: 1.3; }
  .grant-item-meta { font-size: 11px; color: var(--text-muted); margin-top: 3px; display: flex; gap: 8px; }
  .grant-item-bar { height: 3px; background: #e8e8e8; border-radius: 2px; margin-top: 5px; }
  .grant-item-bar-fill { height: 100%; border-radius: 2px; background: var(--teal); }
  .grant-item-bar-fill.warn { background: var(--amber); }
  .grant-item-bar-fill.danger { background: var(--red); }

  /* ── Main ── */
  .main { flex: 1; overflow-y: auto; padding: 20px; }
  .no-grant {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; height: 60vh; color: var(--text-muted); gap: 12px;
  }
  .no-grant-icon { font-size: 48px; }

  /* ── Grant header ── */
  .grant-header {
    background: var(--white); border-radius: var(--radius);
    padding: 16px 20px; margin-bottom: 16px; border: 1px solid var(--border);
    display: flex; align-items: flex-start; justify-content: space-between; gap: 16px;
  }
  .grant-title { font-size: 18px; font-weight: 600; color: var(--navy); }
  .grant-subtitle { font-size: 12px; color: var(--text-muted); margin-top: 3px; }
  .status-badge {
    display: inline-block; padding: 3px 10px; border-radius: 20px;
    font-size: 11px; font-weight: 600; margin-left: 10px;
  }
  .status-Active { background: var(--green-light); color: var(--green); }
  .status-Ended  { background: var(--red-light); color: var(--red); }

  /* ── Metric cards ── */
  .metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px,1fr)); gap: 12px; margin-bottom: 16px; }
  .metric-card {
    background: var(--white); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow);
  }
  .metric-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .4px; }
  .metric-value { font-size: 22px; font-weight: 600; margin-top: 4px; color: var(--navy); }
  .metric-value.green { color: var(--green); }
  .metric-value.amber { color: var(--amber); }
  .metric-value.red   { color: var(--red); }
  .metric-sub { font-size: 11px; color: var(--text-muted); margin-top: 3px; }
  .metric-bar { height: 4px; background: #e8e8e8; border-radius: 2px; margin-top: 8px; overflow: hidden; }
  .metric-bar-fill { height: 100%; border-radius: 2px; transition: width .4s; }

  /* ── Tabs ── */
  .tabs { display: flex; gap: 0; border-bottom: 2px solid var(--border); margin-bottom: 16px; }
  .tab-btn {
    padding: 9px 18px; font-size: 13px; font-weight: 500; cursor: pointer;
    border: none; background: none; color: var(--text-muted);
    border-bottom: 2px solid transparent; margin-bottom: -2px; transition: color .15s;
  }
  .tab-btn:hover { color: var(--teal); }
  .tab-btn.active { color: var(--teal); border-bottom-color: var(--teal); }
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  /* ── Cards ── */
  .card {
    background: var(--white); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 16px 20px;
    margin-bottom: 16px; box-shadow: var(--shadow);
  }
  .card-title {
    font-size: 12px; font-weight: 600; color: var(--text-muted);
    text-transform: uppercase; letter-spacing: .4px; margin-bottom: 14px;
    padding-bottom: 10px; border-bottom: 1px solid var(--border);
  }

  /* ── Info grid ── */
  .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 24px; }
  .info-row { }
  .info-label { font-size: 11px; color: var(--text-muted); margin-bottom: 2px; }
  .info-value { font-size: 13px; color: var(--text); font-weight: 500; line-height: 1.4; }
  .info-value.full { grid-column: 1 / -1; }

  /* ── Budget table ── */
  .bv-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .bv-table th {
    text-align: left; padding: 8px 10px; font-size: 11px;
    color: var(--text-muted); font-weight: 600; text-transform: uppercase;
    border-bottom: 1px solid var(--border); background: var(--gray-light);
  }
  .bv-table th.right, .bv-table td.right { text-align: right; }
  .bv-table td { padding: 9px 10px; border-bottom: 1px solid #f0f0f0; }
  .bv-table tr:last-child td { border-bottom: none; font-weight: 600; background: var(--gray-light); }
  .bv-table tr:hover td { background: var(--teal-light); }
  .var-pos { color: var(--green); }
  .var-neg { color: var(--red); }
  .mini-bar { height: 6px; background: #e8e8e8; border-radius: 3px; min-width: 80px; overflow: hidden; }
  .mini-bar-fill { height: 100%; border-radius: 3px; }

  /* ── Reporting table ── */
  .rep-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .rep-table th {
    text-align: left; padding: 8px 10px; font-size: 11px;
    font-weight: 600; color: var(--text-muted); text-transform: uppercase;
    border-bottom: 1px solid var(--border); background: var(--gray-light);
  }
  .rep-table td { padding: 9px 10px; border-bottom: 1px solid #f0f0f0; vertical-align: top; }
  .rep-table tr:last-child td { border-bottom: none; }

  /* ── GL lines table ── */
  .gl-controls { display: flex; gap: 10px; margin-bottom: 12px; align-items: center; flex-wrap: wrap; }
  .gl-controls select, .gl-controls input {
    padding: 6px 10px; border: 1px solid var(--border); border-radius: var(--radius);
    font-size: 13px; outline: none;
  }
  .gl-controls select:focus, .gl-controls input:focus { border-color: var(--teal); }
  .gl-wrap { overflow-x: auto; }
  .gl-table { width: 100%; border-collapse: collapse; font-size: 12px; min-width: 700px; }
  .gl-table th {
    text-align: left; padding: 7px 10px; font-size: 11px; font-weight: 600;
    color: var(--text-muted); text-transform: uppercase;
    border-bottom: 1px solid var(--border); background: var(--gray-light);
    position: sticky; top: 0;
  }
  .gl-table th.right, .gl-table td.right { text-align: right; }
  .gl-table td { padding: 7px 10px; border-bottom: 1px solid #f0f0f0; }
  .gl-table tr:hover td { background: var(--teal-light); }
  .gl-count { font-size: 12px; color: var(--text-muted); margin-left: auto; }
  .cat-pill {
    display: inline-block; padding: 2px 8px; border-radius: 10px;
    font-size: 11px; font-weight: 500; white-space: nowrap;
  }
  .cat-Grants                { background:#EAF3DE; color:#3B6D11; }
  .cat-Capacity              { background:#E1F5EE; color:#0F6E56; }
  .cat-Capacity-Strengthening{ background:#E1F5EE; color:#0F6E56; }
  .cat-Communications        { background:#E6F1FB; color:#185FA5; }
  .cat-Staffing              { background:#EEEDFE; color:#3C3489; }
  .cat-Travel                { background:#FAEEDA; color:#854F0B; }
  .cat-Overhead              { background:#F1EFE8; color:#444441; }
  .fy-pill { display:inline-block; padding:2px 7px; border-radius:10px; font-size:11px; }
  .fy-FY26 { background:#E6F1FB; color:#185FA5; }
  .fy-FY27 { background:#FAEEDA; color:#854F0B; }
  .fy-Other{ background:#F1EFE8; color:#888; }

  /* ── Income table ── */
  .inc-table { width:100%; border-collapse:collapse; font-size:13px; }
  .inc-table th {
    text-align:left; padding:8px 10px; font-size:11px; font-weight:600;
    color:var(--text-muted); text-transform:uppercase;
    border-bottom:1px solid var(--border); background:var(--gray-light);
  }
  .inc-table th.right, .inc-table td.right { text-align:right; }
  .inc-table td { padding:8px 10px; border-bottom:1px solid #f0f0f0; }
  .inc-table tr:last-child td { border-bottom:none; font-weight:600; background:var(--gray-light); }

  /* ── FY toggle bar ── */
  .fy-toggle { display:flex; gap:8px; margin-bottom:14px; }
  .fy-btn {
    padding:5px 14px; border-radius:20px; border:1px solid var(--border);
    background:white; font-size:12px; cursor:pointer; font-weight:500;
    color:var(--text-muted); transition:all .15s;
  }
  .fy-btn.active { background:var(--teal); color:white; border-color:var(--teal); }

  /* ── Utilities ── */
  .text-right { text-align:right; }
  .text-muted { color:var(--text-muted); }
  .empty-state { text-align:center; padding:32px; color:var(--text-muted); font-size:13px; }
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <div class="header-logo">EM</div>
    <div>
      <div class="header-title">EMpower Grant Dashboard</div>
      <div class="header-sub">Finance · Restricted Fund Intelligence</div>
    </div>
  </div>
  <div class="header-meta" id="header-meta">Loading...</div>
</div>

<div class="layout">
  <!-- ── Sidebar ── -->
  <div class="sidebar">
    <div class="sidebar-search">
      <input type="text" id="search-input" placeholder="Search grants..." oninput="filterGrants()">
    </div>
    <div id="grant-list"></div>
  </div>

  <!-- ── Main content ── -->
  <div class="main" id="main-content">
    <div class="no-grant">
      <div class="no-grant-icon">📊</div>
      <div style="font-size:16px;font-weight:500;color:#333">Select a grant</div>
      <div>Choose a grant from the list to view details</div>
    </div>
  </div>
</div>

<script>
// ── Data ─────────────────────────────────────────────────────────────────────
let ALL_GRANTS = [];
let CURRENT_GRANT = null;
let CURRENT_FY = 'all';

// ── Formatters ────────────────────────────────────────────────────────────────
const fmt = n => n == null ? '—' : '$' + Math.round(n).toLocaleString();
const fmtPct = p => p == null ? '—' : p.toFixed(1) + '%';
const fmtDate = s => {
  if (!s) return '—';
  const d = new Date(s + 'T00:00:00');
  return d.toLocaleDateString('en-GB', {day:'2-digit', month:'short', year:'numeric'});
};
const daysColor = d => d == null ? '' : d < 90 ? 'red' : d < 180 ? 'amber' : 'green';
const barColor  = p => p >= 90 ? '#A32D2D' : p >= 75 ? '#BA7517' : '#1D9E75';
const catClass  = c => 'cat-' + (c||'').replace(/\s*\/\s*Other/,'').replace(/\s+/g,'-');

// ── Load data ─────────────────────────────────────────────────────────────────
async function loadData() {
  try {
    const res = await fetch('grants_data.json');
    if (!res.ok) throw new Error(res.statusText);
    const data = await res.json();
    ALL_GRANTS = data.grants || [];
    document.getElementById('header-meta').textContent =
      `Updated ${data.generated} · FY26: ${data.fy26_period}`;
    buildSidebar(ALL_GRANTS);
  } catch(e) {
    document.getElementById('header-meta').textContent = 'Error loading data';
    document.getElementById('main-content').innerHTML =
      `<div class="no-grant">
         <div class="no-grant-icon">⚠️</div>
         <div style="font-size:15px;font-weight:500">Could not load grants_data.json</div>
         <div>Make sure grants_data.json is in the same folder as index.html</div>
         <div style="margin-top:8px;font-size:12px;color:#999">${e.message}</div>
       </div>`;
  }
}

// ── Sidebar ───────────────────────────────────────────────────────────────────
function buildSidebar(grants) {
  const groups = {};
  grants.forEach(g => {
    const eg = g.entity_group || g.entity || 'Other';
    if (!groups[eg]) groups[eg] = [];
    groups[eg].push(g);
  });

  let html = '';
  Object.keys(groups).sort().forEach(grp => {
    html += `<div class="sidebar-group-label">${grp}</div>`;
    groups[grp].forEach(g => {
      const pct = g.pct_used || 0;
      const fillColor = pct >= 90 ? 'danger' : pct >= 75 ? 'warn' : '';
      html += `
        <div class="grant-item" id="item-${g.code}" onclick="selectGrant('${g.code}')">
          <div class="grant-item-name">${g.name}</div>
          <div class="grant-item-meta">
            <span>${g.code}</span>
            <span>${fmtPct(pct)} spent</span>
            <span class="status-badge status-${g.grant_status}">${g.grant_status}</span>
          </div>
          <div class="grant-item-bar">
            <div class="grant-item-bar-fill ${fillColor}" style="width:${Math.min(pct,100)}%"></div>
          </div>
        </div>`;
    });
  });
  document.getElementById('grant-list').innerHTML = html;
}

function filterGrants() {
  const q = document.getElementById('search-input').value.toLowerCase();
  const filtered = q
    ? ALL_GRANTS.filter(g => g.name.toLowerCase().includes(q) ||
                              g.code.toLowerCase().includes(q) ||
                              (g.lead||'').toLowerCase().includes(q))
    : ALL_GRANTS;
  buildSidebar(filtered);
  if (CURRENT_GRANT) {
    const el = document.getElementById('item-' + CURRENT_GRANT.code);
    if (el) el.classList.add('active');
  }
}

// ── Select grant ─────────────────────────────────────────────────────────────
function selectGrant(code) {
  CURRENT_GRANT = ALL_GRANTS.find(g => g.code === code);
  if (!CURRENT_GRANT) return;
  document.querySelectorAll('.grant-item').forEach(el => el.classList.remove('active'));
  const el = document.getElementById('item-' + code);
  if (el) el.classList.add('active');
  CURRENT_FY = 'all';
  renderGrant(CURRENT_GRANT);
}

// ── Render grant ──────────────────────────────────────────────────────────────
function renderGrant(g) {
  const daysLeft = g.days_remaining;
  const fy26exp  = g.fy26_expenses || 0;
  const fy27exp  = g.fy27_expenses || 0;
  const totexp   = g.total_expenses || 0;
  const totinc   = g.total_income   || 0;
  const budget   = g.budget_total   || 0;
  const balance  = g.balance || (budget - totexp);
  const pct      = g.pct_used || 0;

  document.getElementById('main-content').innerHTML = `
    <!-- Grant header -->
    <div class="grant-header">
      <div>
        <div class="grant-title">
          ${g.name}
          <span class="status-badge status-${g.grant_status}">${g.grant_status}</span>
        </div>
        <div class="grant-subtitle">${g.code} · ${g.entity} · Lead: ${g.lead || '—'}</div>
      </div>
      <div style="text-align:right;font-size:12px;color:var(--text-muted)">
        <div>${fmtDate(g.start_date)} – ${fmtDate(g.end_date)}</div>
        ${daysLeft != null ? `<div style="margin-top:3px;color:${daysLeft<90?'var(--red)':daysLeft<180?'var(--amber)':'var(--green)'}">
          ${daysLeft > 0 ? daysLeft + ' days remaining' : Math.abs(daysLeft) + ' days past end'}</div>` : ''}
      </div>
    </div>

    <!-- Metric cards -->
    <div class="metrics">
      <div class="metric-card">
        <div class="metric-label">Total Award (Budget)</div>
        <div class="metric-value">${fmt(budget)}</div>
        <div class="metric-sub">${g.orig_currency !== 'USD' ? g.orig_currency + ' original' : 'USD'}</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">Income Received</div>
        <div class="metric-value green">${fmt(totinc)}</div>
        <div class="metric-sub">USD (Sage converted)</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">FY26 Expenses</div>
        <div class="metric-value ${pct>=90?'red':pct>=75?'amber':''}">${fmt(fy26exp)}</div>
        <div class="metric-sub">Jul 2025 – Jun 2026</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">FY27 Expenses</div>
        <div class="metric-value">${fmt(fy27exp)}</div>
        <div class="metric-sub">Jul 2026 – Jun 2027</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">Total Spent</div>
        <div class="metric-value ${pct>=90?'red':pct>=75?'amber':''}">${fmt(totexp)}</div>
        <div class="metric-sub">${fmtPct(pct)} of budget</div>
        <div class="metric-bar"><div class="metric-bar-fill"
          style="width:${Math.min(pct,100)}%;background:${barColor(pct)}"></div></div>
      </div>
      <div class="metric-card">
        <div class="metric-label">Remaining Budget</div>
        <div class="metric-value ${balance<0?'red':balance<budget*.1?'amber':'green'}">${fmt(balance)}</div>
        <div class="metric-sub">${fmtPct(100-pct)} unspent</div>
      </div>
    </div>

    <!-- Tabs -->
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('snapshot',this)">Snapshot</button>
      <button class="tab-btn" onclick="switchTab('agreement',this)">Grant Agreement</button>
      <button class="tab-btn" onclick="switchTab('budget',this)">Budget vs Actuals</button>
      <button class="tab-btn" onclick="switchTab('income',this)">Income</button>
      <button class="tab-btn" onclick="switchTab('gl',this)">GL Lines</button>
    </div>

    <!-- TAB: Snapshot -->
    <div id="tab-snapshot" class="tab-content active">
      ${renderSnapshot(g)}
    </div>

    <!-- TAB: Agreement -->
    <div id="tab-agreement" class="tab-content">
      ${renderAgreement(g)}
    </div>

    <!-- TAB: Budget vs Actuals -->
    <div id="tab-budget" class="tab-content">
      ${renderBudget(g)}
    </div>

    <!-- TAB: Income -->
    <div id="tab-income" class="tab-content">
      ${renderIncome(g)}
    </div>

    <!-- TAB: GL Lines -->
    <div id="tab-gl" class="tab-content">
      ${renderGL(g)}
    </div>
  `;

  // Attach GL filter events
  const catSel  = document.getElementById('gl-cat-filter');
  const fySel   = document.getElementById('gl-fy-filter');
  const srchInp = document.getElementById('gl-search');
  if (catSel)  catSel.oninput  = () => filterGL(g);
  if (fySel)   fySel.oninput   = () => filterGL(g);
  if (srchInp) srchInp.oninput = () => filterGL(g);
}

// ── Tab: Snapshot ─────────────────────────────────────────────────────────────
function renderSnapshot(g) {
  const rows = (g.budget_categories||[]).map(b => {
    const pct = b.pct_used || 0;
    return `<tr>
      <td><span class="${catClass(b.category)} cat-pill">${b.category}</span></td>
      <td class="right">${fmt(b.budget)}</td>
      <td class="right">${fmt(b.fy26_actual)}</td>
      <td class="right">${fmt(b.fy27_actual)}</td>
      <td class="right ${b.variance<0?'var-neg':'var-pos'}">${fmt(b.variance)}</td>
      <td class="right">${fmtPct(pct)}</td>
      <td style="width:90px">
        <div class="mini-bar"><div class="mini-bar-fill"
          style="width:${Math.min(pct,100)}%;background:${barColor(pct)}"></div></div>
      </td>
    </tr>`;
  });

  const totBud = (g.budget_categories||[]).reduce((s,b)=>s+b.budget,0);
  const totFy26= (g.budget_categories||[]).reduce((s,b)=>s+b.fy26_actual,0);
  const totFy27= (g.budget_categories||[]).reduce((s,b)=>s+b.fy27_actual,0);
  const totAct = (g.budget_categories||[]).reduce((s,b)=>s+b.total_actual,0);
  const totVar = totBud - totAct;

  return `
    <div class="card">
      <div class="card-title">Summary by budget category</div>
      <table class="bv-table">
        <thead><tr>
          <th>Category</th>
          <th class="right">Budget</th>
          <th class="right">FY26 Actual</th>
          <th class="right">FY27 Actual</th>
          <th class="right">Variance</th>
          <th class="right">% Used</th>
          <th></th>
        </tr></thead>
        <tbody>${rows.join('')}</tbody>
        <tfoot><tr>
          <td>Total</td>
          <td class="right">${fmt(totBud)}</td>
          <td class="right">${fmt(totFy26)}</td>
          <td class="right">${fmt(totFy27)}</td>
          <td class="right ${totVar<0?'var-neg':'var-pos'}">${fmt(totVar)}</td>
          <td class="right">${fmtPct(totBud>0?totAct/totBud*100:0)}</td>
          <td></td>
        </tr></tfoot>
      </table>
    </div>`;
}

// ── Tab: Agreement ────────────────────────────────────────────────────────────
function renderAgreement(g) {
  return `
    <div class="card">
      <div class="card-title">Grant details</div>
      <div class="info-grid">
        <div class="info-row"><div class="info-label">Grant / Funder</div><div class="info-value">${g.name}</div></div>
        <div class="info-row"><div class="info-label">Code</div><div class="info-value">${g.code}</div></div>
        <div class="info-row"><div class="info-label">Legal Entity</div><div class="info-value">${g.entity}</div></div>
        <div class="info-row"><div class="info-label">Entity Group</div><div class="info-value">${g.entity_group}</div></div>
        <div class="info-row"><div class="info-label">Start Date</div><div class="info-value">${fmtDate(g.start_date)}</div></div>
        <div class="info-row"><div class="info-label">End Date</div><div class="info-value">${fmtDate(g.end_date)}</div></div>
        <div class="info-row"><div class="info-label">Total Award</div><div class="info-value">${fmt(g.budget_total)}</div></div>
        <div class="info-row"><div class="info-label">Original Currency</div><div class="info-value">${g.orig_currency}</div></div>
        <div class="info-row"><div class="info-label">Program Lead</div><div class="info-value">${g.lead || '—'}</div></div>
        <div class="info-row"><div class="info-label">Lead Email</div><div class="info-value">${g.lead_email || '—'}</div></div>
        <div class="info-row"><div class="info-label">Agreement Status</div><div class="info-value">${g.agreement_status || '—'}</div></div>
        <div class="info-row"><div class="info-label">Grant Status</div>
          <div class="info-value"><span class="status-badge status-${g.grant_status}">${g.grant_status}</span></div></div>
        ${g.purpose ? `<div class="info-row" style="grid-column:1/-1">
          <div class="info-label">Grant Purpose</div>
          <div class="info-value">${g.purpose}</div></div>` : ''}
      </div>
    </div>

    ${g.rep_schedule ? `<div class="card">
      <div class="card-title">Reporting schedule</div>
      <div class="info-value" style="white-space:pre-line;line-height:1.6">${g.rep_schedule}</div>
    </div>` : ''}

    ${g.payment_schedule ? `<div class="card">
      <div class="card-title">Payment schedule</div>
      <div class="info-value" style="white-space:pre-line;line-height:1.6">${g.payment_schedule}</div>
    </div>` : ''}`;
}

// ── Tab: Budget vs Actuals ────────────────────────────────────────────────────
function renderBudget(g) {
  return renderSnapshot(g);  // same table, could be expanded
}

// ── Tab: Income ───────────────────────────────────────────────────────────────
function renderIncome(g) {
  const lines = g.income_lines || [];
  if (!lines.length) return `<div class="card"><div class="empty-state">No income recorded in GL</div></div>`;

  const total = lines.reduce((s,l)=>s+l.amount,0);
  const rows  = lines.map(l => `<tr>
    <td>${fmtDate(l.date)}</td>
    <td>${l.ac}</td>
    <td>${l.memo}</td>
    <td class="right" style="color:var(--green);font-weight:500">${fmt(l.amount)}</td>
  </tr>`).join('');

  return `<div class="card">
    <div class="card-title">Income receipts (all dates · USD equivalent)</div>
    <table class="inc-table">
      <thead><tr><th>Date</th><th>Account</th><th>Description</th><th class="right">Amount</th></tr></thead>
      <tbody>${rows}</tbody>
      <tfoot><tr><td colspan="3">Total income received</td><td class="right">${fmt(total)}</td></tr></tfoot>
    </table>
  </div>`;
}

// ── Tab: GL Lines ─────────────────────────────────────────────────────────────
function renderGL(g) {
  const cats = [...new Set((g.gl_lines||[]).map(l=>l.category))].sort();
  const catOpts = cats.map(c=>`<option value="${c}">${c}</option>`).join('');
  return `
    <div class="card">
      <div class="card-title">Expense GL lines (from grant start date)</div>
      <div class="gl-controls">
        <select id="gl-fy-filter">
          <option value="">All FY</option>
          <option value="FY26">FY26</option>
          <option value="FY27">FY27</option>
          <option value="Other">Other</option>
        </select>
        <select id="gl-cat-filter">
          <option value="">All categories</option>${catOpts}
        </select>
        <input id="gl-search" type="text" placeholder="Search memo / vendor..." style="flex:1;min-width:180px">
        <span class="gl-count" id="gl-count"></span>
      </div>
      <div class="gl-wrap">
        <table class="gl-table">
          <thead><tr>
            <th>Date</th><th>FY</th><th>Account</th>
            <th>Category</th><th>Description</th>
            <th class="right">Debit</th><th class="right">Credit</th><th class="right">Net</th>
          </tr></thead>
          <tbody id="gl-tbody"></tbody>
        </table>
      </div>
    </div>`;
}

function filterGL(g) {
  const fy  = (document.getElementById('gl-fy-filter')||{}).value  || '';
  const cat = (document.getElementById('gl-cat-filter')||{}).value || '';
  const srch= ((document.getElementById('gl-search')||{}).value||'').toLowerCase();

  let lines = g.gl_lines || [];
  if (fy)   lines = lines.filter(l => l.fy === fy);
  if (cat)  lines = lines.filter(l => l.category === cat);
  if (srch) lines = lines.filter(l =>
    l.memo.toLowerCase().includes(srch) || l.vendor.toLowerCase().includes(srch) ||
    l.employee.toLowerCase().includes(srch));

  const tbody = document.getElementById('gl-tbody');
  const count = document.getElementById('gl-count');
  if (!tbody) return;

  if (!lines.length) {
    tbody.innerHTML = `<tr><td colspan="8" class="empty-state">No transactions match</td></tr>`;
    if (count) count.textContent = '0 transactions';
    return;
  }

  const total = lines.reduce((s,l)=>s+l.net,0);
  tbody.innerHTML = lines.map(l => `<tr>
    <td style="white-space:nowrap">${fmtDate(l.date)}</td>
    <td><span class="fy-pill fy-${l.fy}">${l.fy}</span></td>
    <td style="white-space:nowrap;font-size:11px">${l.ac}<br><span class="text-muted">${l.ac_name}</span></td>
    <td><span class="${catClass(l.category)} cat-pill">${l.category}</span></td>
    <td style="max-width:280px;font-size:12px">
      ${l.memo ? l.memo.substring(0,100) : ''}
      ${l.vendor ? `<div class="text-muted" style="font-size:11px">${l.vendor}</div>` : ''}
    </td>
    <td class="right">${l.debit ? fmt(l.debit) : '—'}</td>
    <td class="right">${l.credit ? fmt(l.credit) : '—'}</td>
    <td class="right" style="font-weight:500">${fmt(l.net)}</td>
  </tr>`).join('') +
  `<tr style="font-weight:600;background:var(--gray-light)">
    <td colspan="7">Total (${lines.length} transactions)</td>
    <td class="right">${fmt(total)}</td>
  </tr>`;

  if (count) count.textContent = `${lines.length} transaction${lines.length!==1?'s':''}`;
}

// ── Tab switching ─────────────────────────────────────────────────────────────
function switchTab(id, btn) {
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + id).classList.add('active');
  btn.classList.add('active');
  if (id === 'gl' && CURRENT_GRANT) filterGL(CURRENT_GRANT);
}

// ── Init ──────────────────────────────────────────────────────────────────────
loadData();
</script>
</body>
</html>
